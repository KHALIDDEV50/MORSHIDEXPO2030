spring.application.name=MORSHID-Expo2030

# Server port (frontend NEXT_PUBLIC_API_BASE_URL points here: http://<host>:8080/api/v1)
server.port=${PORT:8080}

# CORS: frontend origins allowed to call /api/v1 (comma-separated patterns)
morshid.cors.allowed-origins=${MORSHID_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app}


# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/morshid_expo2030?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.default-property-inclusion=non_null



# AI Provider
#morshid.ai.provider=${MORSHID_AI_PROVIDER:demo}



morshid.ai.provider=openai

# OpenAI API
morshid.ai.openai.api-key=${OPENAI_API_KEY:}
morshid.ai.openai.model=gpt-5-mini